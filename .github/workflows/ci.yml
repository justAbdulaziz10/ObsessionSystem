name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact --config .gitleaks.toml

  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Python and shell syntax
        run: |
          set -e
          for f in bin/*; do
            if head -1 "$f" | grep -q python; then python3 -m py_compile "$f"; echo "py  $f"; fi
          done
          for f in install.sh uninstall.sh evals/run-all.sh evals/*/regression.sh; do
            bash -n "$f" && echo "sh  $f"
          done
          sh -n git-hooks/_dispatch && echo "sh  git-hooks/_dispatch"

  evals:
    name: Regression suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install into a clean HOME and run every suite
        run: evals/run-all.sh
