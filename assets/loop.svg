<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">The self-improvement loop</title>
  <desc id="d">Measure, understand, hypothesize, experiment, verify, promote, document, re-measure. Every system change records evidence and a rollback.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6B78B3"/>
    </marker>
    <style>
      .n{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#EEF1FB}
      .s{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8E97BE}
      .k{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7C86B8}
      .pill{fill:#141A31;stroke:#2B3460;stroke-width:1.5}
      .ln{stroke:#6B78B3;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1200" height="420" rx="20" fill="#0B0F1E"/>
  <text x="600" y="56" text-anchor="middle" style="font:800 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" fill="url(#ink)">Improve because reality proves it — not because it sounds smart</text>

  <!-- top row -->
  <g transform="translate(70 110)"><rect class="pill" width="220" height="86" rx="14"/><text x="18" y="30" class="k">01</text><text x="18" y="56" class="n">Measure</text><text x="18" y="76" class="s">telemetry, eval suites</text></g>
  <g transform="translate(350 110)"><rect class="pill" width="220" height="86" rx="14"/><text x="18" y="30" class="k">02</text><text x="18" y="56" class="n">Understand</text><text x="18" y="76" class="s">read failures, not vibes</text></g>
  <g transform="translate(630 110)"><rect class="pill" width="220" height="86" rx="14"/><text x="18" y="30" class="k">03</text><text x="18" y="56" class="n">Hypothesize</text><text x="18" y="76" class="s">one falsifiable change</text></g>
  <g transform="translate(910 110)"><rect class="pill" width="220" height="86" rx="14"/><text x="18" y="30" class="k">04</text><text x="18" y="56" class="n">Experiment</text><text x="18" y="76" class="s">blind holdout first</text></g>

  <!-- bottom row (right to left) -->
  <g transform="translate(910 270)"><rect class="pill" width="220" height="86" rx="14"/><text x="18" y="30" class="k">05</text><text x="18" y="56" class="n">Verify</text><text x="18" y="76" class="s">before/after numbers</text></g>
  <g transform="translate(630 270)"><rect class="pill" width="220" height="86" rx="14" style="stroke:#3E8E6A"/><text x="18" y="30" class="k">06</text><text x="18" y="56" class="n">Promote</text><text x="18" y="76" class="s">only with canary evidence</text></g>
  <g transform="translate(350 270)"><rect class="pill" width="220" height="86" rx="14"/><text x="18" y="30" class="k">07</text><text x="18" y="56" class="n">Document</text><text x="18" y="76" class="s">ADR + rollback backup</text></g>
  <g transform="translate(70 270)"><rect class="pill" width="220" height="86" rx="14"/><text x="18" y="30" class="k">08</text><text x="18" y="56" class="n">Re-measure</text><text x="18" y="76" class="s">or delete dead weight</text></g>

  <path class="ln" d="M290 153H346" marker-end="url(#arr)"/>
  <path class="ln" d="M570 153H626" marker-end="url(#arr)"/>
  <path class="ln" d="M850 153H906" marker-end="url(#arr)"/>
  <path class="ln" d="M1130 153H1160V313H1134" marker-end="url(#arr)"/>
  <path class="ln" d="M910 313H854" marker-end="url(#arr)"/>
  <path class="ln" d="M630 313H574" marker-end="url(#arr)"/>
  <path class="ln" d="M350 313H294" marker-end="url(#arr)"/>
  <path class="ln" d="M70 313H40V153H66" marker-end="url(#arr)"/>
</svg>
