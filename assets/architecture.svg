<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">ObsessionSystem architecture</title>
  <desc id="d">You give a task to the Claude lead. The router picks the minimum skills and MCPs. Codex workers implement in isolated worktrees with account failover. Reviewers are routed by risk. agent-proof and agent-ship gate completion and delivery. Durable state and background services sit underneath.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0E1C"/>
      <stop offset="1" stop-color="#0D1224"/>
    </linearGradient>
    <linearGradient id="lead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5A6699"/>
    </marker>
    <style>
      .h{font:700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#EEF1FB}
      .s{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9AA3C7}
      .m{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#C9D0EE}
      .lbl{font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:2px;fill:#6B75A3}
      .box{fill:#131930;stroke:#283158;stroke-width:1.5}
      .ln{stroke:#5A6699;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1200" height="760" rx="20" fill="url(#bg)"/>

  <!-- you -->
  <g transform="translate(520 28)">
    <rect width="160" height="54" rx="27" fill="#1A2140" stroke="#3B4687"/>
    <text x="80" y="34" text-anchor="middle" class="h">You</text>
  </g>
  <path class="ln" d="M600 82V116" marker-end="url(#arr)"/>

  <!-- lead -->
  <g transform="translate(330 120)">
    <rect width="540" height="96" rx="16" fill="url(#lead)"/>
    <text x="270" y="40" text-anchor="middle" class="h">Lead · Claude (Opus)</text>
    <text x="270" y="68" text-anchor="middle" class="s" style="fill:#E4E2FF">classify → acceptance criteria → plan → integrate → prove</text>
  </g>

  <!-- three columns -->
  <path class="ln" d="M420 216V238H230V262" marker-end="url(#arr)"/>
  <path class="ln" d="M600 216V262" marker-end="url(#arr)"/>
  <path class="ln" d="M780 216V238H970V262" marker-end="url(#arr)"/>

  <text x="60" y="256" class="lbl">ROUTE</text>
  <g transform="translate(60 266)">
    <rect class="box" width="340" height="168" rx="14"/>
    <text x="22" y="38" class="h">Capability router</text>
    <text x="22" y="64" class="s">minimum sufficient skills, plugins, MCPs</text>
    <text x="22" y="100" class="m">agent-cap recommend</text>
    <text x="22" y="124" class="m">agent-review-route</text>
    <text x="22" y="148" class="m">agent-mode  owner|work|guest</text>
  </g>

  <text x="430" y="256" class="lbl">BUILD</text>
  <g transform="translate(430 266)">
    <rect class="box" width="340" height="168" rx="14"/>
    <text x="22" y="38" class="h">Codex workers (Luna, xhigh)</text>
    <text x="22" y="64" class="s">one isolated git worktree per slice</text>
    <text x="22" y="100" class="m">codex-ha  account 1 ↔ account 2</text>
    <text x="22" y="124" class="m">agent-team-lead / builder</text>
    <text x="22" y="148" class="m">exit 75 → lead takes over</text>
  </g>

  <text x="800" y="256" class="lbl">REVIEW</text>
  <g transform="translate(800 266)">
    <rect class="box" width="340" height="168" rx="14"/>
    <text x="22" y="38" class="h">Risk-routed review</text>
    <text x="22" y="64" class="s">≤ 3 reviewers · Spec + Standards/Risk</text>
    <text x="22" y="100" class="m">general reviewer</text>
    <text x="22" y="124" class="m">agent-risk-reviewer (Opus)</text>
    <text x="22" y="148" class="m">one specialist · ≤ 3 fix cycles</text>
  </g>

  <path class="ln" d="M230 434V470H970V434"/>
  <path class="ln" d="M600 434V500" marker-end="url(#arr)"/>

  <!-- gate -->
  <text x="60" y="494" class="lbl">GATE</text>
  <g transform="translate(60 504)">
    <rect width="1080" height="96" rx="14" fill="#16201A" stroke="#2F5D45" stroke-width="1.5"/>
    <text x="22" y="38" class="h" style="fill:#D1FAE5">Proof &amp; delivery gate</text>
    <text x="22" y="66" class="s" style="fill:#8CC7A8">done is a pass/fail check · inconclusive ≠ pass · no push without a local CI pass for that exact commit</text>
    <text x="760" y="38" class="m" style="fill:#A7F3D0">agent-proof --checks</text>
    <text x="760" y="62" class="m" style="fill:#A7F3D0">agent-ship ci → push</text>
    <text x="760" y="86" class="m" style="fill:#A7F3D0">secret scan · floor guard</text>
  </g>

  <!-- foundation -->
  <text x="60" y="636" class="lbl">FOUNDATION</text>
  <g transform="translate(60 646)">
    <rect class="box" width="345" height="84" rx="14"/>
    <text x="20" y="34" class="h" style="font-size:17px">Durable task state</text>
    <text x="20" y="60" class="m">agent-v2 · SQLite · handoff</text>
  </g>
  <g transform="translate(427 646)">
    <rect class="box" width="345" height="84" rx="14"/>
    <text x="20" y="34" class="h" style="font-size:17px">Memory &amp; telemetry</text>
    <text x="20" y="60" class="m">agent-recall · agent-usage</text>
  </g>
  <g transform="translate(795 646)">
    <rect class="box" width="345" height="84" rx="14"/>
    <text x="20" y="34" class="h" style="font-size:17px">Background services</text>
    <text x="20" y="60" class="m">autopilot · doc-sync · governors</text>
  </g>
</svg>
