    <radialGradient id="glow" cx=".78" cy=".35" r=".55">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B2340" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)" opacity=".55"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow)"/>

  <!-- orbit mark -->
  <g transform="translate(1010 205)" fill="none">
    <circle r="132" stroke="#2A3361" stroke-width="1.5" stroke-dasharray="3 7"/>
